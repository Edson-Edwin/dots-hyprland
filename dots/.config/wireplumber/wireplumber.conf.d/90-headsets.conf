# Prefer a connected Bluetooth headset over the laptop; fall back automatically.
# Keep the normal stereo playback profile until an application needs its microphone.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = true
  linking.follow-default-target = true
}
monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = { update-props = {
      bluez5.auto-connect = [ a2dp_sink hfp_hf hsp_hs ]
    } }
  }
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { priority.session = 1200 } }
  }
  {
    matches = [ { node.name = "~bluez_input.*" } ]
    actions = { update-props = { priority.session = 2200 } }
  }
]
# WirePlumber already ranks USB audio above onboard ALSA and handles analog jack events.
